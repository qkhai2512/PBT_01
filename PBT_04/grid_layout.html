<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <link rel="stylesheet" href="grid.css">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>ShopTLU</h1>
    </header>

    <section class="hero">
        <h2>Big Sale 2025</h2>
        <p>Up to 50% off</p>
    </section>

    <aside class="sidebar">
        <h3>Filters</h3>

        <label><input type="checkbox"> Phones</label>
        <label><input type="checkbox"> Laptops</label>
        <label><input type="checkbox"> Tablets</label>
    </aside>

    <main class="products">

        <div class="card featured">
            Featured Product
        </div>

        <div class="card">Product 1</div>
        <div class="card">Product 2</div>
        <div class="card">Product 3</div>
        <div class="card">Product 4</div>
        <div class="card">Product 5</div>

    </main>

    <aside class="ads">
        <img
        src="https://picsum.photos/200/500"
        alt="ads">
    </aside>

    <footer class="footer">
        Copyright 2025
    </footer>

</div>

</body>
</html>
