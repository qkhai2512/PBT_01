<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Positioning Playground</title>

<link rel="stylesheet" href="positioning.css">
</head>
<body>

<header class="header">

    <div class="logo">
        ShopTLU
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
    </nav>

</header>

<div class="layout">

    <aside class="sidebar">

        <h3>Categories</h3>

        <ul>
            <li>Phone</li>
            <li>Laptop</li>
            <li>Tablet</li>
            <li>Accessory</li>
        </ul>

    </aside>

    <main class="content">

        <div class="product-card">

            <span class="badge">
                HOT
            </span>

            <img
                src="https://picsum.photos/300/200"
                alt="product"
            >

            <h3>iPhone 16</h3>

            <p>25.990.000đ</p>

        </div>

        <div class="dummy"></div>

    </main>

</div>

<button class="scroll-top">
↑
</button>

</body>
</html>
