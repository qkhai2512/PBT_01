<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bootstrap Landing Page</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="#">
ShopTLU
</a>

<button
class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#navMenu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="navMenu">

<ul class="navbar-nav me-auto">

<li class="nav-item">
<a class="nav-link active" href="#">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Products</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">About</a>
</li>

</ul>

<form class="d-flex">

<input
class="form-control me-2"
type="search"
placeholder="Search">

<button class="btn btn-outline-light">
Search
</button>

</form>

</div>

</div>
</nav>

<!-- Hero -->

<div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">

<div class="carousel-inner">

<div class="carousel-item active">

<img
src="https://picsum.photos/1400/500?1"
class="d-block w-100">

<div class="carousel-caption">
<h1>Big Sale</h1>
<p>Up to 50% off</p>
</div>

</div>

<div class="carousel-item">

<img
src="https://picsum.photos/1400/500?2"
class="d-block w-100">

</div>

<div class="carousel-item">

<img
src="https://picsum.photos/1400/500?3"
class="d-block w-100">

</div>

</div>

</div>

<!-- Products -->

<div class="container py-5">

<div class="row g-4">

<!-- 8 products -->

<div class="col-12 col-md-6 col-lg-3">

<div class="card h-100">

<span class="badge bg-danger position-absolute m-2">
Sale
</span>

<img
src="https://picsum.photos/300/200?10"
class="card-img-top">

<div class="card-body">

<h5 class="card-title">
Laptop
</h5>

<p class="card-text">
20.000.000đ
</p>

<button
class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#productModal">

Xem nhanh

</button>

</div>

</div>

</div>

</div>

</div>

<!-- Modal -->

<div
class="modal fade"
id="productModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Product Detail</h5>

<button
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

Thông tin sản phẩm.

</div>

</div>

</div>

</div>

<!-- Footer -->

<footer class="bg-dark text-white py-5">

<div class="container">

<div class="row">

<div class="col-md-3">
Company
</div>

<div class="col-md-3">
Products
</div>

<div class="col-md-3">
Support
</div>

<div class="col-md-3">
Contact
</div>

</div>

</div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
