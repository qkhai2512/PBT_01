<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Media</title>
</head>
<body>

<h1>Sản phẩm</h1>

<figure>
    <img src="https://placehold.co/300x200" alt="iPhone 16" loading="lazy" style="max-width:100%;">
    <figcaption>iPhone 16</figcaption>
</figure>

<figure>
    <img src="https://placehold.co/300x200" alt="Samsung S25" loading="lazy" style="max-width:100%;">
    <figcaption>Samsung</figcaption>
</figure>

<figure>
    <img src="https://placehold.co/300x200" alt="Xiaomi" loading="lazy" style="max-width:100%;">
    <figcaption>Xiaomi</figcaption>
</figure>

<h2>Video YouTube</h2>
<iframe width="300" height="200"
src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>

<h2>Video local</h2>
<video controls poster="https://placehold.co/300x200">
    <source src="video.mp4" type="video/mp4">
    <source src="video.webm" type="video/webm">
</video>

<h2>Audio</h2>
<audio controls>
    <source src="audio.mp3">
</audio>

<h2>SVG</h2>
<svg width="100" height="100">
    <circle cx="50" cy="50" r="40" fill="blue"/>
</svg>

</body>
</html>
