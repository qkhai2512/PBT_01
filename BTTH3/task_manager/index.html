<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">

        <!-- HEADER -->
        <div class="header-box d-flex justify-content-between align-items-center p-4">

            <h1 class="text-white">
                Manage <strong>Tasks</strong>
            </h1>

            <button
                class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#taskModal"
                id="openModalBtn"
            >
                + Add New Task
            </button>

        </div>

        <!-- STATISTICS -->
        <div class="stats-box mt-4">

            <div class="row text-center">

                <div class="col-md-4">
                    <div class="stat-card">
                        <h3 id="totalTasks">0</h3>
                        <p>Total Tasks</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="stat-card">
                        <h3 id="completedTasks">0</h3>
                        <p>Completed</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="stat-card">
                        <h3 id="pendingTasks">0</h3>
                        <p>Pending</p>
                    </div>
                </div>

            </div>

        </div>

        <!-- TABLE -->
        <div class="table-responsive mt-4">

            <table class="table table-hover align-middle">

                <thead>

                    <tr>
                        <th>Status</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Deadline</th>
                        <th>Priority</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="taskList">

                    <!-- JS render -->

                </tbody>

            </table>

        </div>

    </div>

    <!-- MODAL -->
    <div class="modal fade" id="taskModal">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Task Form
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>

                <form id="taskForm">

                    <div class="modal-body">

                        <input type="hidden" id="taskId">

                        <div class="mb-3">

                            <label class="form-label">
                                Task Title
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                class="form-control"
                                id="description"
                                rows="3"
                                required
                            ></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Deadline
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="deadline"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Priority
                            </label>

                            <select
                                class="form-select"
                                id="priority"
                            >
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                            </select>

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Close
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Task
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->
    <script src="main.js"></script>

</body>
</html>
