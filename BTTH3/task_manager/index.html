<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- HEADER -->
        <header class="topbar">

            <div>
                <h1>Task Management Dashboard</h1>
                <p>Manage your daily tasks efficiently</p>
            </div>

            <button id="openModalBtn" class="add-btn">
                + Add Task
            </button>

        </header>

        <!-- STATS -->
        <section class="stats-box">

            <div class="stat-card">

                <h2 id="totalTasks">0</h2>
                <p>Total Tasks</p>

            </div>

            <div class="stat-card completed-card">

                <h2 id="completedTasks">0</h2>
                <p>Completed</p>

            </div>

            <div class="stat-card pending-card">

                <h2 id="pendingTasks">0</h2>
                <p>Pending</p>

            </div>

        </section>

        <!-- TASK TABLE -->
        <section class="table-section">

            <div class="table-header">

                <h2>Task Assignment Board</h2>

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Status</th>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Deadline</th>
                            <th>Priority</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="taskList">

                    </tbody>

                </table>

            </div>

        </section>

    </div>

    <!-- MODAL -->

    <div class="modal" id="taskModal">

        <div class="modal-content">

            <h2>Task Form</h2>

            <form id="taskForm">

                <input type="hidden" id="taskId">

                <div class="form-group">

                    <label>Task Title</label>

                    <input
                        type="text"
                        id="title"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Description</label>

                    <textarea
                        id="description"
                        rows="4"
                        required
                    ></textarea>

                </div>

                <div class="form-group">

                    <label>Deadline</label>

                    <input
                        type="date"
                        id="deadline"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Priority</label>

                    <select id="priority">

                        <option value="Low">Low</option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>

                </div>

                <div class="form-buttons">

                    <button
                        type="button"
                        class="close-btn"
                        id="closeModalBtn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Task
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- MESSAGE -->

    <div class="message" id="message">

    </div>

    <script src="main.js"></script>

</body>
</html>
